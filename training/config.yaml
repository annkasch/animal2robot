dataset: dog-pose-ultralytics   # one of: dog-pose-ultralytics, ap10k, animal-pose
dataset_root: datasets           # base dir; actual data goes in {dataset_root}/{dataset}/
# Species to include during dataset preparation. Default is dog only.
# For ap10k or animal-pose you can extend this list, e.g.: [dog, cat, horse]
# Ignored for dog-pose-ultralytics (already dog-only).
species: [dog]

output_dir: checkpoints/rfdetr_dog_pose

epochs: 50
batch_size: 8
resolution: 576
lr: 1.0e-4
grad_accum_steps: 1
