[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animal2robot"
version = "0.1.0"
description = "Dog pose estimation pipeline → structured gait representation"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
local    = ["rfdetr[train,visual]"]
roboflow = ["inference-sdk"]
train    = ["rfdetr[train]", "pyyaml"]
dev      = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
animal2robot-serve = "animal2robot.api.app:app"
